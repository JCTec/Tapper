name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Show available simulators
        run: xcrun simctl list devicetypes available

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .swiftpm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Tapper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tapper.xcodeproj \
            -scheme Tapper \
            -clonedSourcePackagesDirPath .swiftpm-cache

      - name: Run tests
        env:
          SPM_CACHE_PATH: .swiftpm-cache
        run: bundle exec fastlane test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            fastlane/test_output
          retention-days: 14
          if-no-files-found: warn
